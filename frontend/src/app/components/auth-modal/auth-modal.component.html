<div class="modal-overlay" (click)="closeEvent.emit()">
  <div class="auth-modal card-glass" role="dialog" aria-modal="true" aria-labelledby="auth-modal-dialog-title" (click)="$event.stopPropagation()">
    <!-- Header -->
    <div class="auth-header">
      <div class="brand-head">
        <span class="auth-icon">🏋️</span>
        <h2 id="auth-modal-dialog-title">{{ mode === 'LOGIN' ? 'Entrar no Clube FittShop' : 'Cadastro de Novo Atleta' }}</h2>
      </div>
      <button class="close-btn" (click)="closeEvent.emit()" aria-label="Fechar janela de autenticação">✕</button>
    </div>

    <!-- Security & Purpose Notice Banner -->
    <div *ngIf="authService.authModalNotice()" class="auth-notice-banner">
      <span class="notice-icon">🛡️</span>
      <p class="notice-text">{{ authService.authModalNotice() }}</p>
    </div>

    <!-- Mode Selector Tabs -->
    <div class="auth-tabs" role="tablist">
      <button 
        class="auth-tab" 
        role="tab"
        [attr.aria-selected]="mode === 'LOGIN'"
        [class.active]="mode === 'LOGIN'"
        (click)="mode = 'LOGIN'; errorMessage = ''; successMessage = ''">
        Já tenho Conta (Login)
      </button>
      <button 
        class="auth-tab" 
        role="tab"
        [attr.aria-selected]="mode === 'REGISTER'"
        [class.active]="mode === 'REGISTER'"
        (click)="mode = 'REGISTER'; errorMessage = ''; successMessage = ''">
        Criar Conta (+50 FittCoins)
      </button>
    </div>

    <!-- Body -->
    <div class="auth-body">
      <div *ngIf="errorMessage" class="auth-alert error" role="alert">
        {{ errorMessage }}
      </div>
      <div *ngIf="successMessage" class="auth-alert success" role="status">
        {{ successMessage }}
      </div>

      <!-- LOGIN FORM -->
      <form *ngIf="mode === 'LOGIN'" (ngSubmit)="submitLogin()" class="auth-form">
        <div class="form-field">
          <label for="auth-login-email">E-mail do Atleta</label>
          <input type="email" id="auth-login-email" placeholder="seu-email@dominio.com" [(ngModel)]="loginEmail" name="email" required>
        </div>

        <div class="form-field">
          <label for="auth-login-password">Senha de Acesso</label>
          <input type="password" id="auth-login-password" placeholder="••••••••" [(ngModel)]="loginPassword" name="password" required>
        </div>

        <button type="submit" class="btn-primary auth-btn" [disabled]="isLoading">
          <span *ngIf="!isLoading">Acessar Minha Conta</span>
          <span *ngIf="isLoading">Validando Credenciais...</span>
        </button>

        <p class="quick-credentials-hint">
          💡 <em>Contas de demonstração:</em><br>
          Atleta: <code>atleta&#64;fittshop.com.br</code> | Estoquista: <code>estoquista&#64;fittshop.com.br</code> | Caixa: <code>caixa&#64;fittshop.com.br</code>
        </p>
      </form>

      <!-- REGISTER FORM -->
      <form *ngIf="mode === 'REGISTER'" (ngSubmit)="submitRegister()" class="auth-form">
        <div class="form-field">
          <label for="auth-reg-name">Nome Completo</label>
          <input type="text" id="auth-reg-name" placeholder="Ex: Lucas Silva" [(ngModel)]="registerName" name="name" required>
        </div>

        <div class="form-field">
          <label for="auth-reg-email">E-mail</label>
          <input type="email" id="auth-reg-email" placeholder="lucas@exemplo.com" [(ngModel)]="registerEmail" name="email" required>
        </div>

        <div class="row-2">
          <div class="form-field">
            <label for="auth-reg-password">Senha</label>
            <input type="password" id="auth-reg-password" placeholder="Mínimo 6 caracteres" [(ngModel)]="registerPassword" name="password" required>
          </div>
          <div class="form-field">
            <label for="auth-reg-phone">Telefone / WhatsApp</label>
            <input type="text" id="auth-reg-phone" placeholder="(11) 98888-7777" [(ngModel)]="registerPhone" name="phone">
          </div>
        </div>

        <div class="form-field">
          <label for="auth-reg-cpf">CPF (Para emissão de NF-e)</label>
          <input type="text" id="auth-reg-cpf" placeholder="000.000.000-00" [(ngModel)]="registerCpf" name="cpf">
        </div>

        <button type="submit" class="btn-primary auth-btn" [disabled]="isLoading">
          <span *ngIf="!isLoading">Criar Conta e Resgatar 50 FittCoins</span>
          <span *ngIf="isLoading">Gravando Atleta no Banco de Dados...</span>
        </button>
      </form>
    </div>
  </div>
</div>
