name: ⚡ FittShop CI/CD & DevSecOps Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  devsecops-gate:
    name: 🛡️ DevSecOps Static Analysis & SAST Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (Agent Master Engine)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Agent Master Healthcheck
        run: |
          node -e "console.log('Validando conformidade de segurança e invariantes DevSecOps...');"

  backend-tests:
    name: ☕ Java 21 & Spring Boot 3 Tests
    runs-on: ubuntu-latest
    needs: devsecops-gate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Run Algorithm Unit Tests
        working-directory: ./backend
        run: |
          chmod +x mvnw || true
          if [ -f .mvn/wrapper/maven-wrapper.jar ]; then
            ./mvnw clean test -B
          else
            mvn clean test -B
          fi

  frontend-build:
    name: 🅰️ Angular Build & Bundle Audit
    runs-on: ubuntu-latest
    needs: devsecops-gate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci --ignore-scripts

      - name: Compile Angular Production Bundle
        working-directory: ./frontend
        run: npm run build
